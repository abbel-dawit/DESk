<style>
/* Splash screen — styled inline so it paints before anything else loads */
html,body{background:#06102e;margin:0}
#splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:radial-gradient(900px 600px at 50% 40%,#123a9e 0,#06102e 70%);overflow:hidden;transition:opacity .6s ease,transform .6s ease,visibility 0s .6s}
#splash.out{opacity:0;transform:scale(1.06);visibility:hidden}
#splash .rings{position:absolute;width:min(78vmin,440px);aspect-ratio:1}
#splash .rings i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(90,140,255,.5);opacity:0;animation:spr 2.6s cubic-bezier(.2,.7,.3,1) infinite}
#splash .rings i:nth-child(2){animation-delay:.85s}#splash .rings i:nth-child(3){animation-delay:1.7s}
#splash .core{position:relative;display:grid;justify-items:center;gap:20px;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
#splash .tile{width:min(32vmin,150px);aspect-ratio:1;border-radius:26%;background:linear-gradient(145deg,#3b7bff,#1A5CFF 55%,#1446d6);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 24px 60px rgba(26,92,255,.55);animation:spb .8s cubic-bezier(.2,1.3,.4,1) both}
#splash .tile svg{width:62%;height:62%;overflow:visible}
#splash .clip{stroke-dasharray:90;stroke-dashoffset:90;animation:spd 1.1s .35s ease-out forwards}
#splash .word{color:#fff;font-weight:800;font-size:clamp(34px,8vmin,52px);letter-spacing:-.02em;animation:spw .6s .5s both}
#splash .bar{width:min(46vmin,200px);height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;animation:spw .6s .6s both}
#splash .bar i{display:block;height:100%;width:40%;border-radius:4px;background:#fff;box-shadow:0 0 12px #7aa7ff;animation:spl 1.1s ease-in-out infinite}
#splash .sub{min-height:1.4em;color:#c9d6f5;font-weight:600;font-size:15px;text-align:center;padding:0 20px}
@keyframes spr{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes spb{0%{transform:scale(.4) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes spd{to{stroke-dashoffset:0}}
@keyframes spw{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes spl{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .clip{stroke-dashoffset:0}}
</style>
<link rel="stylesheet" href="css/app.css?v=be9878bbcb">

<body>
<div id="splash" aria-hidden="true"><div class="rings"><i></i><i></i><i></i></div>

 <div class="word">DESk</div><div class="bar"><i></i></div><div class="sub" id="spSub">&nbsp;</div></div></div>
<script>(function(){var L=["Sorting your trays…","Sharpening the scanner…","Locking the key box…","Straightening the papers…","Finding your files…","Polishing the paperclip…"],i=Math.floor(Math.random()*L.length),el=document.getElementById("spSub");function s(){if(!el||!document.getElementById("splash"))return;el.textContent=L[i++%L.length];setTimeout(s,1400)}s()})();</script>
